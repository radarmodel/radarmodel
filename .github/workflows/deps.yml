name: deps

# Runs `go mod tidy` on GitHub and commits go.mod and go.sum to the branch it
# was started on. Claude's cloud sessions can't reach the Go module proxy or
# the checksum database, so module sums are written here instead.
# Start it with:
#   gh api -X POST repos/radarmodel/radarmodel/actions/workflows/deps.yml/dispatches -f ref=BRANCH

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tidy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Tidy and commit
        run: |
          go mod tidy
          go mod verify
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum
          if git diff --cached --quiet; then
            echo "go.mod and go.sum are tidy already."
            exit 0
          fi
          git commit -m "go mod tidy"
          git push origin "HEAD:${GITHUB_REF_NAME}"
